<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<script>

function pegarHora(){
    let data = new Date();
    let hora = data.getHours()
    let minutos = data.getMinutes()
    let segundos = data.getSeconds()
    console.log(`Hora: ${hora}:${minutos}:${segundos}`)
    return { hora, minutos, segundos }
}



function mostrarHora(){
    let horario = pegarHora()
    alert(`A hora atual é: ${horario.hora}:${horario.minutos}:${horario.segundos}`)
}

</script>

</head>
<body>
    <input type="button" value="Mostrar hora atual" onclick="mostrarHora()">
</body>
</html>
