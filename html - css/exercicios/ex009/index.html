<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
    <link rel="shortcut icon" href="icone.ico" type="image/x-icon">
</head>
<body>
    <h1>Trabalhando com Listas</h1>
    <h2>Listas Ordenadas</h2>
<ol type="1"> <!--1 A a I i-->
    <li>Mijar</li>
    <li>Cagar</li>
    <li>Comer</li>
    <li>Fartar</li>
    <li>Ligar para o diddy</li>

</ol>
<h2>Listas não ordenadas</h2>
<ul type="square"> <!--disc circle square-->
    <li>Pão</li>
    <li>Fralda</li>
    <li>Óleo de bebê</li>
    <li>Esponja</li>
    <li>Pringles</li>
    <li>Luvas de borracha</li>

</ul>
    
</body>
</html>
