<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mundo Mágico dos Desenhos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="kids-page">
    <h1>Bem-vindo ao Mundo dos Desenhos!</h1>
    <p>
        Esta página é um espaço para pequenos curtirem entretenimento infantil.
        Aqui você pode escolher um desenho animado e descobrir aventuras incríveis com seus personagens favoritos.
    </p>
    <div class="box">
        <label for="desenhos">Escolha um desenho animado!</label>
        <select id="desenhos">
            <option value="masha">Blue</option>
            <option value="peppa">Hora de Aventura</option>
            <option value="patrulha">O Incrível Mundo de Gumball</option>
            <option value="galinha">Apenas um Show</option>
        </select>
    </div>
    <footer>
        <small>Divirta-se e explore bastante! 🌈</small>
    </footer>
</body>
</html>
