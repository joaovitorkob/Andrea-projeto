<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Classificação por Idade</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Classificação de Usuários</h1>

    <p>
        Este sistema tem como objetivo classificar usuários com base em sua idade e direcioná-los para conteúdos específicos.
        A escolha da idade é <i>essencial</i> para garantir uma experiência adequada para cada faixa etária.
    </p>

    <div class="container">
        <label for="idade">Digite sua idade:</label>
        <input type="number" id="idade" min="0" max="120">
        <button onclick="classificar()">Classificar</button>
    </div>

    <footer>
        <small>
            Desenvolvido por: João Vitor Konig - Programador Web
        </small>
    </footer>

    <!-- JS -->
    <script src="script.js"></script>

</body>
</html>
