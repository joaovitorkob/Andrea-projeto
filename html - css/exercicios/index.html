<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Cadastro</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #333333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: block;
            width: 100%;
            max-width: 520px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            max-width: 90%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        form {
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        h1 {
            color: #000000;
            margin-top: 0;
        }
label {
    display: block;
    margin-top: 15px;
    color: #333333;
    font-weight: 600;
}
input, textarea{
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #cccccc;
    box-sizing: border-box;
}

button {
    padding: 12px 20px;
    margin-top: 20px;
    background-color: #53049c;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    width: 100%;
}
textarea {
    height: 120px;
    width: 100%;
}
p {
    margin-top: 25px;
    color: rgb(0, 0, 0);
}
label input[type="checkbox"] {
    height: 20px;
}

    </style>
</head>
<body>
    <div class="container">
        <h1>Cadastro</h1>
        <form>
        <label>Nome:</label>
<input type="text" name="Nome" required>
<label>CPF</label>

<input type="number" name="CPF" required>
<label>Endereço</label>

<input type="text" name="Endereço" required>
<label>Cidade</label>

<input type="text" name="Cidade" required>
<label>CEP</label>

<input type="number" name="CEP" required>
<label>Email</label>

<input type="email" name="email" required>
<label>Senha</label>

    <input type="password" name="Senha" required>
<label>Confirmação de senha</label>

<input type="password" name="senha" required>
<label>Observações</label>
<textarea name="Observações" id=""></textarea>
<p>Desejo receber informações sobre:</p>
<label>
    <input type="checkbox" name="checkbox" required>
    Notícias 
</label>
<label>
    <input type="checkbox" name="checkbox" required>
    Promoções
</label>
<label>
    <input type="checkbox" name="checkbox" required>
    Eventos 
</label>
<label>
    <input type="checkbox" name="checkbox" required>
    Lista de desejos
</label>
<br>
<button type="submit" name="Cadastrar">Cadastrar</button>
        </form>
    </div>
</body>
</html>
